<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant — Line</title>
<style>
:root{color-scheme:dark;--bg:#090a0d;--ink:#ece9e3;--muted:#96919d;--line:rgba(236,233,227,.11);--accent:#b8a9c9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0;background:var(--line)}body:before{left:0;right:0;top:50%;height:1px}body:after{top:0;bottom:0;left:50%;width:1px;opacity:.42}
.frame{position:fixed;inset:22px;border:1px solid rgba(236,233,227,.08);pointer-events:none}.cross{position:fixed;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);z-index:0}.cross:before,.cross:after{content:"";position:absolute;background:var(--accent);opacity:.55}.cross:before{left:3px;top:-9px;width:1px;height:25px}.cross:after{top:3px;left:-9px;height:1px;width:25px}
.shell{position:relative;z-index:2;width:min(760px,calc(100% - 48px));height:100%;margin:auto;display:grid;grid-template-rows:auto 1fr auto;padding:25px 0 27px}
header{display:flex;align-items:center;gap:13px;color:var(--muted);font:500 10px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase}.mark{width:17px;height:17px;border:1px solid rgba(236,233,227,.23);display:grid;place-items:center;font-size:8px;color:var(--ink)}.brand{color:var(--ink);letter-spacing:.27em}.state{margin-left:auto;opacity:.65}
.log{overflow:auto;scrollbar-width:none;padding:12vh 0 44px}.log::-webkit-scrollbar{display:none}.message{max-width:670px;margin:0 0 29px;padding-left:22px;border-left:1px solid transparent;white-space:pre-wrap;font-size:clamp(18px,2.1vw,25px);line-height:1.49;letter-spacing:-.012em;text-wrap:pretty}.quant{border-left-color:rgba(184,169,201,.23)}.user{margin-left:auto;max-width:540px;padding-left:0;padding-right:22px;border-left:0;border-right:1px solid rgba(236,233,227,.1);color:#c2bdc6;font-size:clamp(15px,1.6vw,19px);font-style:italic;text-align:right}.empty{text-align:center;margin-top:18vh;color:rgba(236,233,227,.45);font-size:clamp(18px,2vw,24px);font-style:italic}
.composer{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;border-top:1px solid var(--line);padding-top:17px}textarea{resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:400 18px/1.45 ui-serif,Georgia,serif;min-height:31px;max-height:124px;padding:2px 0}textarea::placeholder{color:rgba(236,233,227,.34);font-style:italic}button{border:1px solid rgba(236,233,227,.12);background:rgba(255,255,255,.015);color:var(--muted);padding:8px 12px;cursor:pointer;font:500 10px ui-sans-serif,system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase}button:hover{color:var(--ink);border-color:rgba(236,233,227,.22)}button:disabled{opacity:.3}
body.attending .cross{animation:breathe .9s ease-in-out infinite alternate}body.speaking .cross{transform:translate(-50%,-50%) scale(1.35)}@keyframes breathe{from{opacity:.4;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1.4)}}
@media(max-width:600px){.frame{inset:12px}.shell{width:calc(100% - 32px);padding-top:17px}.log{padding-top:9vh}.message{font-size:19px}}
</style>
</head>
<body>
<div class="frame"></div><div class="cross"></div>
<div class="shell">
<header><span class="mark">Q</span><span class="brand">Quant</span><span>as Anything</span><span class="state" id="state">being</span></header>
<main class="log" id="log"><div class="empty" id="empty">What are we looking at?</div></main>
<form class="composer" id="form"><textarea id="input" rows="1" placeholder="Say something…"></textarea><button id="send">ask</button></form>
</div>
<script>
const API='http://127.0.0.1:8765';
const log=document.querySelector('#log'),empty=document.querySelector('#empty'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send'),state=document.querySelector('#state');
function setState(s){state.textContent=s;document.body.className=s;}
function add(role,text){empty?.remove();const el=document.createElement('div');el.className='message '+role;el.textContent=text;log.appendChild(el);log.scrollTo({top:log.scrollHeight,behavior:'smooth'});}
async function ask(text){add('user',text);setState('attending');send.disabled=true;try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});if(!r.ok)throw new Error();const data=await r.json();setState('speaking');add('quant',data.reply||'I could not form that cleanly.');}catch(_){setState('speaking');add('quant','I am here, but the local Quant runtime is not running yet.');}finally{setTimeout(()=>setState('being'),850);send.disabled=false;input.focus();}}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';input.style.height='auto';ask(text)});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,124)+'px'});
</script>
</body>
</html>
